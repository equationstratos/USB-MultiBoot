# ventoy/ventoy_grub.cfg
#
# Fichier automatiquement inclus par Ventoy à la fin de son grub.cfg généré.
# Ne remplace pas la logique interne de Ventoy (détection des ISO, etc.) :
# sert uniquement à personnaliser l'apparence et le comportement du menu.
# Voir docs/CUSTOMIZATION.md pour l'étendre.

insmod all_video
insmod gfxterm
insmod png

if loadfont unicode ; then
    set gfxmode=1024x768
    terminal_output gfxterm
fi

# Couleurs de secours si le thème graphique (ventoy/theme/theme.txt) ne charge pas
set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

set timeout_style=menu
